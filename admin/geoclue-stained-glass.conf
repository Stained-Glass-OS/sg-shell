# Stained Glass OS: GeoClue, the Linux location service (sg-shell).
# Whether it runs at all is the device's location switch (Settings > Privacy >
# Location; sg-location masks geoclue.service when it is off).
#
# The agent is ours (sg-geoclue-agent, a user service at each sign-in):
# GeoClue answers a person's programs only once their agent is there. Windows
# programs ask as "wine"; wine-sg's Windows.Devices.Geolocation checks
# Windows' own switches (Settings > Privacy > Location, per user and for
# desktop apps) before it asks.
[agent]
whitelist=stained-glass

[wine]
allowed=true
system=false
users=
