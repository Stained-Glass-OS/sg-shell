; Stained Glass OS -- recommended settings for the Compatibility tab of a
; program's Properties (sg-shell src/compat). One section per program, named
; by its file name. Our own list: an entry goes in when a program has been
; tested on Stained Glass OS with the settings it names.
;
;   Note=      shown on the tab (required: a section without it is ignored)
;   Version=   win11 win10 win81 win8 win7 vista winxp
;   Admin=1    run as an administrator
;   Desktop=   a window of its own, of this size (e.g. 1280x720)
;   Graphics=  vulkan (DXVK, VKD3D-Proton) or opengl (WineD3D)
;   Env=       NAME=value;NAME=value
;   Args=      arguments added to its command line
;
; Example (not a real entry):
; [example.exe]
; Note=Starts only in a window of its own with WineD3D.
; Desktop=1280x720
; Graphics=opengl
