; SG Office -- which LibreOffice "Get SG Office" installs, and how.
;
; The installer is The Document Foundation's own, downloaded from them when
; the user asks: we never redistribute it. Its SHA-256 is pinned here (from
; download.documentfoundation.org's published .sha256 for this file); a
; download that does not match is never run. Updating LibreOffice is changing
; Version, Url and Sha256 together, in a new sg-office package.
;
; Payload is the version of our settings on top (sg-office.xcd, templates,
; SG Office Functions); a launcher that finds an installation with an older
; one applies the new one (office/setup).
[LibreOffice]
Version=26.8.0
Url=https://download.documentfoundation.org/libreoffice/stable/26.8.0/win/x86_64/LibreOffice_26.8.0_Win_x86-64.msi
Sha256=4aa6c6e1895f4055104effcb556bd3362d20c6ad707c149543304f395ef9db95
; for all users; SG Office's file types stay ours (REGISTER_NO_MSO_TYPES);
; no update checks (the package pins the version), no quick starter, no
; desktop shortcuts; English interface
MsiProperties=ALLUSERS=1 REGISTER_NO_MSO_TYPES=1 ISCHECKFORPRODUCTUPDATES=0 QUICKSTART=0 CREATEDESKTOPLINK=0 UI_LANGS=en_US RebootYesNo=No
Payload=3
